<style>

.sk{background:linear-gradient(90deg,#F1E8DA 25%,#F8F1E6 50%,#F1E8DA 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px;height:150px;margin:0 0 14px}

.err{text-align:center;padding:60px 16px}
.err .e{font-size:54px}
.err h2{color:var(--wine);margin:10px 0 6px}

.fc{background:var(--sand);border-radius:14px;padding:12px;margin:0 0 10px}
.fc .fh{display:flex;align-items:center;gap:10px}
.fc .ic{font-size:22px;flex-shrink:0}
.fc .n{flex:1;min-width:0}.fc .n b{display:block;font-size:15px}.fc .n span{font-size:12.5px;color:var(--mut)}

.fa button:active{background:var(--tint)}
.fc.busy{opacity:.5;pointer-events:none}
.fc .src{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.6}.fc .src a,.rs a{color:var(--wine)}
.rl{display:flex;gap:10px;background:var(--sand);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.rl .ri{font-size:22px;flex-shrink:0}.rl p{margin:0 0 4px;font-size:13.5px;line-height:1.7}.rs{font-size:11.5px;color:var(--mut);line-height:1.8}
.rs .cons{background:#FFF8E8;border:1px solid #EBD7A6;color:#7A5A12;border-radius:999px;padding:1px 8px}
.kpis{display:flex;gap:10px;margin-bottom:10px}.kpis div{flex:1;background:var(--tint);border-radius:12px;padding:10px;text-align:center}.kpis b{display:block;font-size:22px;color:var(--wine);font-weight:800}.kpis span{font-size:12.5px;color:var(--mut)}
.mrow{cursor:pointer}.chev{color:var(--mut);transition:transform .2s;font-size:12px}.mrow.open .chev{transform:rotate(180deg)}
.tl{padding:8px 12px 2px}
.tlo{list-style:none;margin:0;padding:0}
.tlo li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.tlo li>span{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--wine);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.tlo li b{font-size:13.5px;display:block}.tlo li small{font-size:12px;color:var(--mut)}
.tlo li.pend>span{border-style:dashed;border-color:#C9BBAA}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.on{opacity:1}
.noanim .card{animation:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar .tr i{transition:none}}
i[data-lucide],svg.lucide{width:1.15em;height:1.15em;vertical-align:-.2em;stroke-width:2}
.ec{width:100%;direction:ltr}
.chg{display:flex;align-items:center;gap:14px}.chg .ec{flex:1;height:170px}.chg p{margin:0;flex:1;font-size:14px;line-height:1.8}.chg p b{color:var(--wine)}
.chg .pc{font-size:34px;font-weight:700;color:var(--olive);direction:ltr;line-height:1.1}
.card h2 svg.lucide{color:var(--wine)}
</style>

<div class="wrap" id="app">

  <div id="main"><div class="sk"></div><div class="sk" style="height:110px"></div><div class="sk" style="height:180px"></div></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<a class="back" href="/">💬 ارجع للبوت</a>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const token = decodeURIComponent((location.pathname.match(/^\/d\/([^/?#]+)/) || [])[1] || new URLSearchParams(location.search).get('t') || '');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const f1 = x => (Math.round(x * 10) / 10).toString();
const LTD = { site: 'https://flwp.gfsa.gov.sa/', ios: 'https://apps.apple.com/app/id6745878156', android: 'https://play.google.com/store/apps/details?id=sa.gov.gfsa.flwp.app', huawei: 'https://appgallery.huawei.com/app/C115643345' };
const platform = () => { const u = navigator.userAgent || ''; if (/HUAWEI|HONOR|HMSCore|HarmonyOS|HuaweiBrowser/i.test(u)) return 'huawei'; if (/iPhone|iPad|iPod/i.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios'; if (/Android/i.test(u)) return 'android'; return 'desktop' };
const COOK = {
  'عربي': x => `قلّلي كمية الرز ${x} في كل وجبة، يعطيك العافية.`,
  'English': x => `Please cook ${x} cup(s) less rice per meal. Thank you!`,
  'Tagalog': x => `Magluto po ng ${x} tasa na mas kaunting kanin bawat luto. Salamat!`,
  'اردو': x => `براہ کرم ہر کھانے میں ${x} کپ چاول کم پکائیں۔ شکریہ!`,
  'हिन्दी': x => `कृपया हर बार ${x} कप कम चावल पकाएँ। धन्यवाद!`,
  'বাংলা': x => `অনুগ্রহ করে প্রতিবার ${x} কাপ কম চাল রান্না করুন। ধন্যবাদ!`,
  'Indonesia': x => `Tolong masak ${x} gelas beras lebih sedikit setiap kali. Terima kasih!`,
};
const cupsAr = x => { const w = Math.floor(x), h = x % 1 ? ' ونص' : ''; return x === .5 ? 'نص كوب' : w === 1 ? 'كوب' + h : w === 2 ? 'كوبين' + h : w + ' أكواب' + h };

let QUIET = false, tickT = null;
function countUp(el, to, dec = 0, ms = 1000) {
  if (reduce || QUIET || !isFinite(to)) { el.textContent = dec ? to.toFixed(dec) : Math.round(to); return }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3), v = to * e; el.textContent = dec ? v.toFixed(dec) : Math.round(v); if (k < 1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
const dayLabel = iso => { const d = new Date(iso), n = new Date(), a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(n.getFullYear(), n.getMonth(), n.getDate()), k = Math.round((b - a) / 864e5); let h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0'); const p = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; const tm = `${h}:${m} ${p}`; return (k <= 0 ? 'اليوم' : k === 1 ? 'أمس' : k < 8 ? `قبل ${k} أيام` : `${d.getDate()}/${d.getMonth() + 1}`) + ' · ' + tm };
const grams = g => (g >= 1000 ? f1(g / 1000) + ' كجم' : Math.round(g) + ' جم');
const hoursTxt = h => { if (h < 1) return 'أقل من ساعة'; if (h < 24) return `باقي ${Math.round(h)} ساعة`; const d = Math.floor(h / 24); if (d >= 60) return `باقي ${Math.round(d / 30)} شهر`; const r = Math.round(h - d * 24); return `باقي ${d === 1 ? 'يوم' : d === 2 ? 'يومين' : d + ' أيام'}` + (r && d < 7 ? ` و${r} ساعة` : '') };
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600) };
const TLI = { analyzed: ['📷', 'تحليل الصورة'], fridge: ['🧊', 'دخل الثلاجة'], freezer: ['❄️', 'انتقل للفريزر'], eaten: ['✅', 'أُكل'], partly_eaten: ['🌓', 'أُكل نصفه'], thrown: ['🗑️', 'رُمي'], expired: ['⌛', 'انتهت مدته قبل ما ينأكل'], donated: ['🤝', 'تبرعتوا فيه'] };
const END = ['eaten', 'partly_eaten', 'thrown', 'expired', 'donated'];
const timeline = m => '<ol class="tlo">' + m.timeline.map(x => { const [i, t] = TLI[x.step] || ['•', x.step]; return `<li><span>${i}</span><div><b>${t}${x.detail ? ' · ' + esc(x.detail) : ''}</b><small>${dayLabel(x.at)}</small></div></li>` }).join('') + (m.timeline.some(x => END.includes(x.step)) ? '' : '<li class="pend"><span>⏳</span><div><b>بانتظار المصير</b></div></li>') + '</ol>';
const RI = { room_time: '⏱️', temps: '🌡️', cooling: '🧊', reheat: '♨️', rice: '🍚', leftovers_general: '📅', thaw: '💧', doubt: '👃', donation: '🤝' };
const srcLink = (name, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}</a>` : `<span class="cons">${esc(name)}</span>`;
function fridgeCard(i) {
  const fz = i.storage === 'freezer', exp = i.hours_left <= 0;
  return `<div class="fc" data-id="${esc(i.item_id)}" data-su="${esc(i.safe_until)}" data-tot="${i.total_hours || ''}"><div class="fh"><span class="ic">${fz ? '❄️' : '🧊'}</span><div class="n"><b>${esc(i.name)}</b><span>${grams(i.grams)}${i.dish_name && i.dish_name !== i.name ? ' · ' + esc(i.dish_name) : ''}${fz ? ' · فريزر' : ''}</span></div><div class="r"></div></div><div class="cd"><i></i></div>
    <div class="fa">${exp ? '<button data-a="expired">تخلصنا منه</button>' : '<button data-a="eaten">أكلناه</button><button data-a="half">نصه</button><button data-a="thrown">رميناه</button>' + (fz ? '' : '<button data-a="freezer">للفريزر ❄️</button>')}</div>
    <div class="src">مدة الحفظ: ${esc(i.range)} · المصدر: ${srcLink(i.source_name, i.source_url)}${i.source_url ? '' : ''}</div></div>`;
}
const OUT = { eaten: ['✅', 'أُكل'], partly_eaten: ['🌓', 'أُكل نصفه'], thrown: ['🗑️', 'رُمي'], donated: ['🤝', 'تبرعتوا فيه'], in_fridge: ['🧊', 'في الثلاجة'], analyzed: ['📷', 'تم تحليله'] };

function ring(p) {
  const r = 46, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="نسبة الإنقاذ ${Math.round(p * 100)}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#EADFD0" stroke-width="12"/><circle id="ringc" cx="60" cy="60" r="${r}" fill="none" stroke="#6E1E2B" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)" data-to="${c * (1 - p)}"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#6E1E2B" id="ringt">0%</text></svg>`;
}
function bars(daily) {
  const W = 360, H = 150, base = H - 20, top = 8, n = daily.length, gw = (W - 8) / n;
  const max = Math.max(1, ...daily.map(d => d.grams_left));
  let s = `<svg viewBox="0 0 ${W} ${H}" id="bars" role="img" aria-label="رسم أعمدة آخر 30 يوم"><line x1="4" y1="${base}" x2="${W - 4}" y2="${base}" stroke="#EADFD0"/>`;
  daily.forEach((d, i) => {
    const x = 4 + i * gw, hl = d.grams_left / max * (base - top), hs = Math.min(d.grams_saved, d.grams_left) / max * (base - top);
    s += `<rect x="${(x + gw * .08).toFixed(1)}" y="${(base - hl).toFixed(1)}" width="${(gw * .38).toFixed(1)}" height="${hl.toFixed(1)}" rx="1.5" fill="#D9C08A"/><rect x="${(x + gw * .54).toFixed(1)}" y="${(base - hs).toFixed(1)}" width="${(gw * .38).toFixed(1)}" height="${hs.toFixed(1)}" rx="1.5" fill="#6B7F3A"/>`;
  });
  [0, 14, 29].forEach(i => { const d = new Date(daily[i].day + 'T12:00:00'); s += `<text x="${(4 + i * gw + gw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="10" fill="#7B6F66">${d.getDate()}/${d.getMonth() + 1}</text>` });
  return s + '</svg>';
}

function render(D) {
  const f = D.family, st = D.stats, cityTxt = f.city ? esc(f.city) : '';
  $('#sub').innerHTML = [cityTxt, f.household_size ? `${f.household_size} أفراد` : '', f.is_demo ? '<span class="chip">أسرة تجريبية</span>' : ''].filter(Boolean).join(' · ') || '&nbsp;';
  let h = '';

  const L = (D.sankey && D.sankey.links) || [];
  if (L.length) {
    const col = { 'محلَّل': '#6E1E2B', 'ثلاجة': '#B8892E', 'فريزر': '#C9A24F', 'بدون تخزين': '#B9A98F', 'أُكل': '#6B7F3A', 'أُكل نصه': '#A3B070', 'تبرعنا به': '#B8892E', 'انرمى': '#A9606B', 'انتهت مدته': '#8B8077', 'مفتوح': '#CDBFA9' };
    const dp = n => n === 'محلَّل' ? 0 : ['ثلاجة', 'فريزر', 'بدون تخزين'].includes(n) ? 1 : 2, used = new Set(); L.forEach(l => { used.add(l.source); used.add(l.target) });
    ec('sankeyChart', { tooltip: { ...TIP, formatter: p => p.dataType === 'edge' ? `${p.data.source} ← ${p.data.target}<br><b>${p.data.value} كجم</b>` : `<b>${p.name}</b><br>${p.value} كجم` },
      series: [{ type: 'sankey', left: 4, right: 56, top: 6, bottom: 6, nodeWidth: 12, nodeGap: 8, layoutIterations: 0, draggable: false, label: { fontFamily: FONT, fontSize: 11, color: '#2B2B2B' }, lineStyle: { color: 'gradient', curveness: .5, opacity: .35 }, data: [...used].map(n => ({ name: n, depth: dp(n), itemStyle: { color: col[n] || '#7B6F66' } })), links: L }] });
  }
}
addEventListener('resize', () => ECH.forEach(c => c.resize()));

function fail(code) {
  $('#sub').innerHTML = '&nbsp;';
  $('#main').innerHTML = code === 404
    ? `<div class="err"><div class="e">🔍</div><h2>ما لقينا هذي اللوحة</h2><p>الرابط غير صحيح أو ناقص. افتحوا اللوحة من البوت عشان يوصلكم الرابط الصحيح.</p><a class="btn" href="/">💬 ارجع للبوت</a></div>`
    : `<div class="err"><div class="e">😅</div><h2>عندنا ضغط الحين</h2><p>ما قدرنا نحمّل لوحتكم، جرّبوا بعد شوي.</p><button class="btn" onclick="load()">🔁 أعد المحاولة</button></div>`;
}
// تحديث الأرقام فورًا بعد أي تعديل (بدون حركة العدّ)
async function refresh() {
  const r = await fetch('/api/dashboard?t=' + encodeURIComponent(token));
  if (!r.ok) throw 0;
  QUIET = true; try { render(await r.json()) } finally { QUIET = false }
}
async function load() {
  if (!token) return fail(404);
  try {
    const r = await fetch('/api/dashboard?t=' + encodeURIComponent(token));
    if (!r.ok) return fail(r.status === 404 ? 404 : 500);
    render(await r.json());
  } catch (e) { fail(500) }
}
load();
</script>

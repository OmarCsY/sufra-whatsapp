<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرصد سُفرة · لوحة بيانات مقترحة</title>
<meta name="description" content="مرصد سُفرة: لوحة بيانات مقترحة لبرنامج لتدوم والجمعيات، أرقام مجمعة بدون هوية عن بواقي الأكل في البيوت">
<meta name="theme-color" content="#6E1E2B">
<link rel="icon" href="/icons/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" href="/icons/favicon-64.png?v=4">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#6E1E2B;--wine2:#8B3A47;--wine3:#A9606B;--wine4:#C58C94;--wine5:#E2BDC2;--tint:#F4EAEA;--sand:#FBF6EE;--card:#fff;--gold:#B8892E;--olive:#6B7F3A;--olive2:#A3B070;--ink:#2B2B2B;--mut:#7B6F66;--line:#EADFD0;--sandd:#D9C08A;--warn:#A3243B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 48px}
i[data-lucide],svg.lucide{width:1.15em;height:1.15em;vertical-align:-.2em;stroke-width:2}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 320px;min-width:0}
.brand img{width:58px;height:auto;aspect-ratio:1024/820;object-fit:contain;flex-shrink:0}
.brand h1{margin:0;font-size:24px;font-weight:700;color:var(--wine);line-height:1.25}
.brand p{margin:2px 0 0;font-size:13.5px;color:var(--mut);line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--tint);color:var(--wine);border:1px solid #E6CDD0;border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mut);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--wine);color:#fff}
select{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;max-width:100%}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.sw input{display:none}.sw i.t{width:40px;height:22px;border-radius:999px;background:#D7CCBD;position:relative;transition:.2s;display:inline-block;vertical-align:middle}
.sw i.t::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i.t{background:var(--wine)}.sw input:checked+i.t::after{inset-inline-start:21px}
.banner{display:flex;gap:10px;align-items:center;background:#FFF8E8;border:1px solid #EBD7A6;color:#7A5A12;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.6;margin:8px 0 14px}
.crumb{display:inline-flex;align-items:center;gap:6px;margin-inline-start:6px}
.crumb button{border:0;background:var(--wine);color:#fff;border-radius:999px;font:inherit;font-size:12.5px;padding:3px 10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(110,30,43,.06),0 6px 20px rgba(110,30,43,.06);min-width:0;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 4px;font-size:17px;font-weight:700;color:var(--wine);display:flex;align-items:center;gap:8px}
.card .sub{margin:0 0 12px;font-size:13px;color:var(--mut);line-height:1.7}
@media(min-width:760px){.c6{grid-column:span 6}.c4{grid-column:span 6}.c8{grid-column:span 12}.c12{grid-column:span 12}}
@media(min-width:1100px){.c4{grid-column:span 4}.c8{grid-column:span 8}.c6{grid-column:span 6}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:18px;padding:14px 14px 10px;box-shadow:0 1px 2px rgba(110,30,43,.06),0 6px 20px rgba(110,30,43,.06);position:relative;overflow:hidden;animation:up .5s ease both}
.kpi .l{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:500}
.kpi .v{font-size:30px;font-weight:700;color:var(--gold);line-height:1.2;margin:4px 0 2px;direction:ltr;text-align:right;white-space:nowrap}
.kpi .v small{font-size:14px;color:var(--mut);font-weight:500;margin-inline-start:4px}
.kpi.olive .v{color:var(--olive)}
.kpi .n{font-size:11.5px;color:var(--mut)}
.kpi svg.sp{display:block;width:100%;height:30px;margin-top:6px}
.hero{background:linear-gradient(160deg,#6E1E2B 0%,#521620 100%);color:#fff}
.hero h2{color:#fff}.hero .sub{color:#F0DDB0}
.hero .row{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media(min-width:760px){.hero .row{grid-template-columns:1fr 1fr}}
.hero .big{font-size:64px;font-weight:700;color:#E9C777;line-height:1;direction:ltr;text-align:right}
.hero .big small{font-size:20px;color:#fff;font-weight:600;margin-inline-start:8px}
.hero p{margin:8px 0 0;font-size:14.5px;line-height:1.8;color:#fff}
.hero .how{margin-top:12px;font-size:12.5px;line-height:1.8;color:#E7D5D8;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.ch{width:100%;height:300px;direction:ltr}.ch.s{height:240px}.ch.m{height:360px}.ch.l{height:430px}
.src{font-size:11.5px;color:var(--mut);line-height:1.8;margin-top:8px}.src a{color:var(--wine)}
.list{display:flex;flex-direction:column;gap:10px}
.bar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.bar .h span{color:var(--mut);font-size:13px}
.bar .t{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%;width:0;border-radius:6px;background:var(--wine);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.o .t i{background:var(--olive)}.bar.g .t i{background:var(--gold)}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.stat div{flex:1;min-width:110px;background:var(--tint);border-radius:14px;padding:10px 12px}.stat b{display:block;font-size:22px;color:var(--wine);font-weight:700;direction:ltr;text-align:right}.stat span{font-size:12.5px;color:var(--mut)}
.mult{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7;margin-top:10px}.mult b{color:var(--wine);font-size:22px}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.cups svg{width:42px;height:48px}
.ins{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.ins{grid-template-columns:repeat(3,1fr)}}
.ib{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.ib .fg{display:inline-block;background:var(--wine);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;margin-bottom:8px;direction:ltr}
.ib h3{margin:0 0 6px;font-size:15px;color:var(--wine)}.ib p{margin:0;font-size:13.5px;line-height:1.8}
.ib.c{background:var(--tint);border-color:#E6CDD0}
.tt{font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 8px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;background:var(--wine);color:#fff;font:inherit;font-weight:600;font-size:14.5px;padding:10px 16px;cursor:pointer;text-decoration:none}
.btn.o{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}
details{border:1.5px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 10px;background:#fff}
summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--wine);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
details ul{margin:0 0 10px;padding-inline-start:20px;font-size:13.5px;line-height:1.9}
.rl{font-size:13px;line-height:1.8;margin:0 0 8px}.rl a,details a{color:var(--wine)}
.cons{background:#FFF8E8;border:1px solid #EBD7A6;color:#7A5A12;border-radius:999px;padding:1px 8px;font-size:11.5px}
.empty{text-align:center;padding:34px 12px;color:var(--mut);line-height:1.8}.empty .e{font-size:42px}
.sk{background:linear-gradient(90deg,#F1E8DA 25%,#F8F1E6 50%,#F1E8DA 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px;min-height:130px}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
footer{margin-top:22px;text-align:center;font-size:12.5px;color:var(--mut);line-height:1.9}
.errbox{text-align:center;padding:60px 16px}.errbox .e{font-size:52px}
@media print{
  body{background:#fff}.wrap{max-width:none;padding:0}
  .filters,.btns,#toast,.noprint,.crumb button{display:none!important}
  .card,.kpi{box-shadow:none;border:1px solid #ddd;animation:none;break-inside:avoid}
  .grid{gap:10px}.card{grid-column:span 12!important}
  .hero{background:#fff!important;color:#000!important;border:2px solid var(--wine)}.hero *{color:#222!important}.hero .big{color:var(--wine)!important}
  details{display:block}details[open] ul{display:block}
}
@media (prefers-reduced-motion:reduce){.card,.kpi{animation:none}.bar .t i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/icons/logo.png?v=4" alt="سُفرة" width="58" height="46">
      <div>
        <h1>مرصد سُفرة</h1>
        <p>لوحة بيانات مقترحة لبرنامج لتدوم والجمعيات <span class="chip"><i data-lucide="info"></i> مقترحة من فريق ذُخر، مو لوحة رسمية</span></p>
      </div>
    </div>
    <div class="filters">
      <div class="seg" id="daysSeg"><button data-d="7">7 أيام</button><button data-d="30">30 يوم</button><button data-d="90">90 يوم</button></div>
      <select id="regionSel" aria-label="المنطقة"></select>
      <label class="sw"><input type="checkbox" id="demoSw"><i class="t"></i><span>بيانات توضيحية</span></label>
    </div>
  </header>
  <div id="banner"></div>
  <div id="app"><div class="kpis"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="grid" style="margin-top:16px"><div class="sk c12" style="grid-column:span 12;min-height:220px"></div><div class="sk" style="grid-column:span 12;min-height:320px"></div></div></div>
  <footer>مرصد سُفرة لوحة مقترحة من فريق ذُخر لغرض العرض، وليست لوحة رسمية لبرنامج لتدوم أو أي جهة. الأرقام مجمعة بدون هوية.</footer>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = x => (Math.round(x * 10) / 10).toLocaleString('en-US'), f0 = x => Math.round(x).toLocaleString('en-US');
const C = { wine: '#6E1E2B', wine2: '#8B3A47', wine3: '#A9606B', wine4: '#C58C94', wine5: '#E2BDC2', gold: '#B8892E', olive: '#6B7F3A', olive2: '#A3B070', sandd: '#D9C08A', ink: '#2B2B2B', mut: '#7B6F66', line: '#EADFD0' };
const FONT = '"IBM Plex Sans Arabic", Tahoma, sans-serif';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CHARITY_XY = { 'الرياض': [46.6753, 24.7136], 'حائل': [41.7208, 27.5114], 'عنيزة': [43.993, 26.084], 'جدة': [39.1925, 21.4858], 'ينبع': [38.0618, 24.089], 'الطائف': [40.4158, 21.2703], 'الخرج': [47.312, 24.1556], 'المدينة المنورة': [39.5692, 24.5247] };  // مراكز مدن الجمعيات (معلومة عامة)
const OCC = { daily: 'أيام عادية', gathering: 'عزائم', other: 'مناسبات أخرى', ramadan: 'رمضان', eid: 'عيد' };
const WK_ORDER = [6, 7, 1, 2, 3, 4, 5];   // الأسبوع السعودي يبدأ السبت
const OUTCOME_AR = { eaten: 'أُكل', half: 'أُكل نصفه', donated: 'تبرع به', thrown: 'انرمى', expired: 'انتهت مدته', open: 'مفتوح' };

const qs = new URLSearchParams(location.search);
const S = { days: [7, 30, 90].includes(+qs.get('days')) ? +qs.get('days') : 30, region: qs.get('region') || '', demo: qs.get('demo') === '1' };
let D = null, charts = [], GEO = null, reqId = 0;

const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400) };
const icons = () => { try { lucide.createIcons() } catch (e) {} };
function countUp(el, to, dec = 0, ms = 1100) {
  if (!el) return;
  const fmt = v => (dec ? v.toFixed(dec) : Math.round(v)).toLocaleString('en-US');
  if (reduce || !isFinite(to)) { el.textContent = fmt(to); return }
  const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step) }; requestAnimationFrame(step);
}
function mk(id, opt, onClick) {
  const el = document.getElementById(id); if (!el) return null;
  const ch = echarts.init(el, null, { renderer: 'svg' });
  ch.setOption({ textStyle: { fontFamily: FONT }, animationDuration: reduce ? 0 : 900, animationEasing: 'cubicOut', ...opt });
  if (onClick) ch.on('click', onClick);
  charts.push(ch); return ch;
}
const tipCss = 'direction:rtl;text-align:right;font-family:' + FONT.replace(/"/g, "'") + ';border-radius:10px;';
const TIP = { backgroundColor: '#fff', borderColor: C.line, textStyle: { color: C.ink, fontFamily: FONT, fontSize: 13 }, extraCssText: 'box-shadow:0 4px 16px rgba(110,30,43,.15);' + tipCss };
function spark(vals, color) {
  if (!vals || vals.length < 2 || !vals.some(v => v > 0)) return '';
  const W = 120, H = 30, mx = Math.max(...vals), mn = Math.min(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, H - 3 - (v - mn) / rg * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr"><path d="${d} L${W} ${H} L0 ${H} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const ma7 = a => a.map((_, i) => { const s = a.slice(Math.max(0, i - 6), i + 1); return Math.round(s.reduce((x, y) => x + y, 0) / s.length * 100) / 100 });
const srcLink = (n, u) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>` : `<span class="cons">${esc(n)}</span>`;

/* ---------- الفلاتر والرابط ---------- */
function syncUrl() { const p = new URLSearchParams(); if (S.days !== 30) p.set('days', S.days); if (S.region) p.set('region', S.region); if (S.demo) p.set('demo', '1'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '')) }
function paintFilters() {
  $$('#daysSeg button').forEach(b => b.classList.toggle('on', +b.dataset.d === S.days));
  $('#demoSw').checked = S.demo;
  $('#banner').innerHTML = S.demo ? `<div class="banner"><i data-lucide="flask-conical"></i><span><b>تعرض اللوحة بيانات توضيحية لأسر تجريبية لغرض العرض.</b> الأرقام مو لأسر حقيقية.</span></div>` : '';
  icons();
}
function fillRegions(list) {
  const sel = $('#regionSel'); sel.innerHTML = `<option value="">كل المناطق</option>` + (list || []).map(r => `<option ${r === S.region ? 'selected' : ''}>${esc(r)}</option>`).join('');
}
$('#daysSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.days = +b.dataset.d; reload() });
$('#regionSel').addEventListener('change', e => { S.region = e.target.value; reload() });
$('#demoSw').addEventListener('change', e => { S.demo = e.target.checked; reload() });
function setRegion(r) { S.region = S.region === r ? '' : r; reload() }

/* ---------- التحميل ---------- */
async function reload() {
  syncUrl(); paintFilters();
  const id = ++reqId;
  charts.forEach(c => c.dispose()); charts = [];
  $('#app').innerHTML = `<div class="kpis"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="grid" style="margin-top:16px"><div class="sk" style="grid-column:span 12;min-height:220px"></div><div class="sk" style="grid-column:span 12;min-height:320px"></div></div>`;
  const p = `days=${S.days}&demo=${S.demo ? 1 : 0}` + (S.region ? '&region=' + encodeURIComponent(S.region) : '');
  try {
    const [r, g] = await Promise.all([fetch('/api/observatory?' + p), GEO ? Promise.resolve(GEO) : fetch('/data/sa-regions.json').then(x => x.json())]);
    if (!r.ok) throw new Error('http ' + r.status);
    if (id !== reqId) return;
    GEO = g; D = await r.json(); fillRegions(D.regions); render(D);
    fetch('/api/insights?' + p).then(x => x.ok ? x.json() : null).then(j => { if (id === reqId) renderInsights(j) }).catch(() => renderInsights(null));
  } catch (e) {
    if (id !== reqId) return;
    $('#app').innerHTML = `<div class="card errbox"><div class="e">😅</div><h2 style="justify-content:center">ما قدرنا نحمّل المرصد</h2><p class="sub">جرّبوا بعد شوي.</p><button class="btn" onclick="reload()"><i data-lucide="refresh-cw"></i> أعد المحاولة</button></div>`; icons();
  }
}

/* ---------- الرسم ---------- */
function render(D) {
  const k = D.kpis;
  if (!k || !k.meals) {
    $('#app').innerHTML = `<div class="card empty"><div class="e">🗺️</div><h2 style="justify-content:center">${S.demo ? 'ما فيه بيانات لهذا الفلتر' : 'لا توجد بيانات حقيقية بعد'}</h2><p>${S.demo ? 'جرّبوا فترة أو منطقة ثانية.' : 'ما سجّلت أسر حقيقية وجبات للحين. تقدرون تستعرضون شكل اللوحة ببيانات توضيحية لأسر تجريبية.'}</p><div class="btns" style="justify-content:center">${S.demo ? (S.region ? '<button class="btn" id="clrR"><i data-lucide="x"></i> إلغاء فلتر المنطقة</button>' : '') : '<button class="btn" id="goDemo"><i data-lucide="flask-conical"></i> عرض بيانات توضيحية</button>'}</div></div>`;
    const a = $('#goDemo'); if (a) a.onclick = () => { S.demo = true; reload() }; const b = $('#clrR'); if (b) b.onclick = () => { S.region = ''; reload() }; icons(); return;
  }
  const daily = (D.daily || []).slice(0, -1), obs = daily.map(d => d.kg_observed), sav = daily.map(d => d.kg_saved), rate = daily.map(d => d.kg_observed ? d.kg_saved / d.kg_observed * 100 : 0);
  const crumb = S.region ? `<span class="crumb"><span class="chip">${esc(S.region)}</span><button id="clrReg">إلغاء الفلتر</button></span>` : '';
  const KP = [
    ['users', 'الأسر النشطة', k.families_active, 0, '', `من ${f0(k.families_total)} أسرة`, null, ''],
    ['utensils', 'وجبات محللة', k.meals, 0, '', '', daily.map(d => d.meals), C.wine],
    ['scale', 'كجم مرصودة', k.kg_observed, 1, '', 'بواقي بعد الأكل', obs, C.gold],

  const pal = [C.wine, C.wine2, C.wine3, C.gold, '#C9A24F', C.olive, C.olive2, C.wine4, '#8B8077'];
  mk('chTree', { tooltip: { ...TIP, formatter: p => `<b>${esc(p.name)}</b><br>${f1(p.value)} كجم · ${p.data.share}% من المرصود` },
    series: [{ type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false }, width: '100%', height: '100%', left: 0, top: 0, right: 0, bottom: 0, itemStyle: { borderColor: '#fff', borderWidth: 3, gapWidth: 2, borderRadius: 8 },
      label: { show: true, formatter: p => `{n|${p.name}}\n{s|${p.data.share}%}`, rich: { n: { fontSize: 14, fontWeight: 700, color: '#fff', fontFamily: FONT, lineHeight: 22 }, s: { fontSize: 12, color: '#ffffffcc', fontFamily: FONT } } }, upperLabel: { show: false },
      data: (D.by_category || []).map((c, i) => ({ name: c.label || c.category, value: c.kg, share: c.share_pct, itemStyle: { color: pal[i % pal.length] } })) }] });

  // Sankey
  const nodeColor = { 'محلَّل': C.wine, 'ثلاجة': C.gold, 'فريزر': '#C9A24F', 'بدون تخزين': '#B9A98F', 'أُكل': C.olive, 'أُكل نصه': C.olive2, 'تبرعنا به': C.gold, 'انرمى': C.wine3, 'انتهت مدته': '#8B8077', 'مفتوح': '#CDBFA9' };
  const depth = n => n === 'محلَّل' ? 0 : ['ثلاجة', 'فريزر', 'بدون تخزين'].includes(n) ? 1 : 2;
  const used = new Set(); (D.sankey.links || []).forEach(l => { used.add(l.source); used.add(l.target) });
  mk('chSankey', { tooltip: { ...TIP, trigger: 'item', formatter: p => p.dataType === 'edge' ? `${esc(p.data.source)} ← ${esc(p.data.target)}<br><b>${f1(p.data.value)} كجم</b>` : `<b>${esc(p.name)}</b><br>${f1(p.value)} كجم` },
    series: [{ type: 'sankey', left: 8, right: 70, top: 10, bottom: 10, nodeWidth: 16, nodeGap: 12, layoutIterations: 0, draggable: false, emphasis: { focus: 'adjacency' },
      label: { fontFamily: FONT, color: C.ink, fontSize: 13 }, lineStyle: { color: 'gradient', curveness: .5, opacity: .35 },
      data: (D.sankey.nodes || []).filter(n => used.has(n)).map(n => ({ name: n, depth: depth(n), itemStyle: { color: nodeColor[n] || C.mut } })), links: D.sankey.links }] });

  // خريطة حرارية: يوم الأسبوع × الوجبة
  const slots = ['فطور', 'غداء', 'عشاء'].filter(s => (D.matrix || []).some(c => c.slot === s)), cellMap = {}; (D.matrix || []).forEach(c => { cellMap[c.dow + '|' + c.slot] = c });
  const hd = []; WK_ORDER.forEach((dw, xi) => slots.forEach((s, yi) => { const c = cellMap[dw + '|' + s]; if (c) hd.push([xi, yi, c.avg_g, c.meals]) }));
  const hv = hd.map(d => d[2]);
  mk('chHeat', { grid: { left: 4, right: 10, top: 10, bottom: 46, containLabel: true }, tooltip: { ...TIP, formatter: p => `<b>${(D.weekdays || {})[WK_ORDER[p.value[0]]]} · ${slots[p.value[1]]}</b><br>متوسط البواقي: <b>${f0(p.value[2])} جم</b><br>عدد الوجبات: ${f0(p.value[3])}` },
    xAxis: { type: 'category', data: WK_ORDER.map(d => (D.weekdays || {})[d]), splitArea: { show: true, areaStyle: { color: ['#fff', '#fff'] } }, axisTick: { show: false }, axisLabel: { color: C.ink, fontFamily: FONT, fontSize: 12, interval: 0 } },
    yAxis: { type: 'category', data: slots, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { color: C.ink, fontFamily: FONT, fontSize: 13 } },
    visualMap: { dimension: 2, min: hv.length ? Math.min(...hv) : 0, max: hv.length ? Math.max(...hv) : 1, orient: 'horizontal', left: 'center', bottom: 0, itemWidth: 12, itemHeight: 110, text: ['أعلى', 'أقل'], calculable: false, textStyle: { color: C.mut, fontFamily: FONT }, inRange: { color: ['#F8EFD9', C.sandd, C.gold, C.wine3, C.wine] } },
    series: [{ type: 'heatmap', data: hd, label: { show: true, formatter: p => f0(p.value[2]), color: '#2B2B2B', fontSize: 11, fontFamily: FONT }, itemStyle: { borderColor: '#fff', borderWidth: 3, borderRadius: 8 }, emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,.25)' } } }] });

  // العزائم مقابل الأيام العادية
  const oc = D.by_occasion || [];
  mk('chOcc', { grid: { left: 8, right: 16, top: 26, bottom: 4, containLabel: true }, tooltip: { ...TIP, formatter: p => { const o = oc[p.dataIndex]; return `<b>${OCC[o.occasion] || o.occasion}</b><br>${f0(o.meals)} وجبة<br>متوسط البواقي: <b>${f1(o.avg_g_per_meal / 1000)} كجم</b>` } },
    xAxis: { type: 'category', data: oc.map(o => OCC[o.occasion] || o.occasion), axisTick: { show: false }, axisLabel: { color: C.ink, fontFamily: FONT, fontSize: 13 } }, yAxis: { type: 'value', show: false },
    series: [{ type: 'bar', barWidth: '45%', data: oc.map(o => ({ value: o.avg_g_per_meal / 1000, itemStyle: { color: o.occasion === 'daily' ? C.sandd : C.wine, borderRadius: [10, 10, 0, 0] } })), label: { show: true, position: 'top', formatter: p => f1(p.value) + ' كجم', color: C.gold, fontWeight: 700, fontFamily: FONT } }] });

  // التبرعات
  const dn = D.donations || [];
  if (dn.length) mk('chDon', { grid: { left: 4, right: 120, top: 4, bottom: 4, containLabel: true }, tooltip: { ...TIP, trigger: 'axis', axisPointer: { type: 'none' }, formatter: p => { const d = dn[dn.length - 1 - p[0].dataIndex]; return `<b>${esc(d.charity)}</b><br>${esc(d.city)}<br>${d.count} طلب · اتفاق ${d.agreed} (${Math.round(d.agreed / d.count * 100)}%)<br>${f1(d.kg)} كجم` } },
    xAxis: { type: 'value', show: false }, yAxis: { type: 'category', data: [...dn].reverse().map(d => d.charity + ' · ' + d.city), axisTick: { show: false }, axisLine: { show: false }, axisLabel: { color: C.ink, fontFamily: FONT, fontSize: 12.5 } },
    series: [{ type: 'bar', barWidth: 18, data: [...dn].reverse().map(d => ({ value: d.kg, itemStyle: { color: C.gold, borderRadius: 8 } })), label: { show: true, position: 'right', formatter: p => { const d = dn[dn.length - 1 - p.dataIndex]; return `${f1(p.value)} كجم · اتفاق ${Math.round(d.agreed / d.count * 100)}%` }, color: C.ink, fontFamily: FONT, fontSize: 12 } }] });
}

/* ---------- الرؤى والتوصيات ---------- */
function renderInsights(j) {
  const el = $('#insCard'); if (!el) return;
  const ins = (j && j.insights) || [], cam = (j && j.campaigns) || [];
  if (!ins.length && !cam.length) { el.style.display = 'none'; return }
  el.style.display = ''; el.innerHTML = `<h2><i data-lucide="sparkles"></i> رؤى وتوصيات للحملات</h2><p class="sub">مولّدة بالذكاء الاصطناعي من أرقام اللوحة فقط، وكل وحدة تذكر رقمها.${S.demo ? ' (بيانات توضيحية)' : ''}</p>
    <div class="tt">رؤى من البيانات</div><div class="ins">${ins.map(i => `<div class="ib"><span class="fg">${esc(i.figure)}</span><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join('')}</div>
    <div class="tt">توصيات لحملات توعوية</div><div class="ins">${cam.map(i => `<div class="ib c"><span class="fg">${esc(i.figure)}</span><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join('')}</div>`;
  icons();
}

/* ---------- تنزيل CSV ---------- */
function csv(D) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', rows = [];
  const sec = (title, head, data) => { rows.push([title].map(q).join(',')); rows.push(head.map(q).join(',')); data.forEach(r => rows.push(r.map(q).join(','))); rows.push('') };
  const k = D.kpis;
  rows.push(q('مرصد سُفرة (لوحة مقترحة)') + ',' + q(D.demo ? 'بيانات توضيحية' : 'بيانات الأسر الحقيقية') + ',' + q('الفترة: ' + D.days + ' يوم') + ',' + q('المنطقة: ' + (D.region || 'الكل')) + ',' + q(D.generated_at), ''); rows.push('');
  sec('المؤشرات', ['المؤشر', 'القيمة'], [['الأسر النشطة', k.families_active], ['الوجبات', k.meals], ['كجم مرصودة', k.kg_observed], ['كجم منقذة', k.kg_saved], ['كجم مهدورة', k.kg_lost], ['كجم متبرع بها', k.kg_donated], ['ريال منقذة', k.sar_saved], ['نسبة الإنقاذ %', k.save_rate_pct], ['كربون متجنب (تقديري) كجم', Math.round(k.kg_saved * 25) / 10]]);
  sec('المدن', ['المدينة', 'الأسر', 'الوجبات', 'كجم مرصودة', 'كجم منقذة', 'كجم متبرع بها', 'كجم بواقي لكل أسرة شهريًا'], (D.by_city || []).map(c => [c.city, c.families, c.meals, c.kg_observed, c.kg_saved, c.kg_donated, c.kg_per_family_month]));
  sec('المناطق', ['المنطقة', 'الأسر', 'كجم مرصودة', 'كجم منقذة', 'كجم متبرع بها', 'كجم بواقي لكل أسرة شهريًا'], (D.by_region || []).filter(r => !r.empty && !r.hidden).map(r => [r.region, r.families, r.kg_observed, r.kg_saved, r.kg_donated, r.kg_per_family_month]));
  sec('يوميًا', ['اليوم', 'الوجبات', 'كجم مرصودة', 'كجم منقذة'], (D.daily || []).map(d => [d.day, d.meals, d.kg_observed, d.kg_saved]));
  sec('أنواع الأكل', ['النوع', 'كجم', 'النسبة %'], (D.by_category || []).map(c => [c.label || c.category, c.kg, c.share_pct]));
  sec('أعلى الأصناف', ['الصنف', 'كجم', 'متوسط الجرام', 'عدد المرات'], (D.top_items || []).map(t => [t.name, t.kg, t.avg_g, t.times]));
  sec('يوم الأسبوع × الوجبة', ['اليوم', 'الوجبة', 'الوجبات', 'متوسط الجرام'], (D.matrix || []).map(c => [(D.weekdays || {})[c.dow], c.slot, c.meals, c.avg_g]));
  sec('المناسبات', ['المناسبة', 'الوجبات', 'كجم', 'متوسط الجرام للوجبة'], (D.by_occasion || []).map(o => [OCC[o.occasion] || o.occasion, o.meals, o.kg, o.avg_g_per_meal]));
  sec('المصائر', ['المصير', 'كجم', 'الأصناف'], (D.outcomes || []).map(o => [OUTCOME_AR[o.outcome] || o.outcome, o.kg, o.items]));
  sec('التبرعات', ['الجمعية', 'المدينة', 'الطلبات', 'اتفقوا', 'كجم'], (D.donations || []).map(d => [d.charity, d.city, d.count, d.agreed, d.kg]));
  const blob = new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `sufra-observatory-${D.days}d${D.demo ? '-demo' : ''}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('تم تنزيل الملف ✓');
}

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => charts.forEach(c => c.resize()), 150) });
if (typeof echarts === 'undefined') { $('#app').innerHTML = '<div class="card errbox"><div class="e">😅</div><h2 style="justify-content:center">تعذّر تحميل مكتبة الرسوم</h2><p class="sub">تأكدوا من الاتصال وأعيدوا المحاولة.</p></div>' } else reload();
</script>
